<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>baba English</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="baba-icon-192.png">
<link rel="apple-touch-icon" href="baba-icon-180.png">
<style>
.lock{max-width:420px;margin:30px auto}.lock h2{margin-top:22px}.lock input{margin-top:12px;font-size:18px}

:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#1d2733;--soft:#5b6673;--line:#e6dccd;--navy:#22223b;--navy-ink:#fff;--accent:#e4572e;--ok:#e3f1e4;--ok-ink:#1e5b2c;--no:#fbe5df;--no-ink:#8a2f17;--chip:#efe6d8;--bar:#d9cdbb;--sure:#2e7d4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a21;--card:#1c242e;--ink:#eef1f4;--soft:#a5afba;--line:#2e3a47;--navy:#9cc0ee;--navy-ink:#0f1720;--accent:#ee8a5f;--ok:#1d3a26;--ok-ink:#b9e6c5;--no:#43231b;--no-ink:#ffc6b5;--chip:#26313d;--bar:#34414f;--sure:#5cc184}}
:root[data-theme="dark"]{--bg:#141a21;--card:#1c242e;--ink:#eef1f4;--soft:#a5afba;--line:#2e3a47;--navy:#9cc0ee;--navy-ink:#0f1720;--accent:#ee8a5f;--ok:#1d3a26;--ok-ink:#b9e6c5;--no:#43231b;--no-ink:#ffc6b5;--chip:#26313d;--bar:#34414f;--sure:#5cc184}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;line-height:1.2;margin:0 0 8px}
h1{font-size:26px}h2{font-size:24px}h3{font-size:19px;margin-top:4px}
.top{display:flex;gap:12px;align-items:center;margin:4px 0 14px}.top img{width:52px;height:52px;border-radius:12px}.top p{margin:0;color:var(--soft);font-size:15px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--soft);font:inherit;font-weight:600;padding:10px 6px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hero h2{font-size:26px}
.note{color:var(--soft);font-size:15px;margin:8px 0 0}
button{font:inherit;cursor:pointer}
.big{display:block;width:100%;background:var(--navy);color:var(--navy-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:18px;margin-top:12px}
.big.alt{background:var(--chip);color:var(--ink)}
.plain{background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.ghost{display:block;width:100%;background:none;border:0;color:var(--soft);padding:12px;margin-top:4px;text-decoration:underline}
.danger{background:var(--no);color:var(--no-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions .big{margin-top:0}
.sel{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:600;font-size:15px}
select,textarea,input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:24px;font-family:Georgia,serif}.stats span{font-size:13px;color:var(--soft)}
.how{margin:0;padding-left:20px;color:var(--soft)}.how li{margin:4px 0}
.list{list-style:none;margin:8px 0 0;padding:0}
.row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:var(--ink)}
.row span{flex:1;min-width:0}.row b{display:block;font-weight:600}.row small{display:block;color:var(--soft);font-size:14px}.row i{font-style:normal;color:var(--soft);font-size:22px}
.bar{position:relative;height:6px;background:var(--bar);border-radius:3px;margin-top:6px;overflow:hidden}.bar i,.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}.bar i{background:var(--navy);opacity:.45}.bar b{background:var(--sure)}
.back{background:none;border:0;color:var(--soft);padding:0 0 10px;font-weight:600}
.lvl{color:var(--soft);margin:0 0 10px;font-size:15px}
.rule{background:var(--chip);border-radius:12px;padding:12px 14px;margin:8px 0 12px}
.ex{list-style:none;padding:0;margin:6px 0 0}.ex li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ex li span{flex:1;min-width:0}.ex b{display:block;font-weight:600}.ex small{display:block;color:var(--soft);font-size:15px}
.say{background:var(--chip);border:0;border-radius:50%;width:38px;height:38px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:8px;background:var(--bar)}.dot.b1{background:#e0a458}.dot.b2,.dot.b3{background:#8fbf7f}.dot.b4{background:var(--sure)}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--chip);border:2px solid transparent;border-radius:10px;padding:10px;color:var(--ink);font-weight:600}.seg button.on{border-color:var(--navy)}
.foot{color:var(--soft);font-size:14px;text-align:center}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px}.fb p{margin:0 0 4px;font-weight:700}.fb b{display:block;font-size:19px}.fb small{display:block;margin-top:4px;opacity:.9;font-size:15px}
.fb.ok{background:var(--ok);color:var(--ok-ink)}.fb.no{background:var(--no);color:var(--no-ink)}
/* Runde */
.rtop{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.rtop span{color:var(--soft);font-size:14px;min-width:42px;text-align:right}
.x{background:var(--chip);border:0;border-radius:50%;width:36px;height:36px;color:var(--ink)}
.prog{flex:1;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{color:var(--accent);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.ask{font-size:21px}
.prompt{font-size:24px;font-family:"Iowan Old Style",Georgia,serif;margin:14px 0}.prompt.gp{font-size:22px}
.prompt u{text-decoration:none;border-bottom:2px solid var(--accent);display:inline-block;min-width:70px}
.answer{font-size:22px;font-weight:700;color:var(--navy);margin:8px 0}
.sayrow{display:flex;gap:8px;margin:8px 0 12px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font-size:17px}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.right{background:var(--ok);border-color:var(--ok-ink);color:var(--ok-ink);font-weight:700}.opt.wrong{background:var(--no);border-color:var(--no-ink);color:var(--no-ink)}.opt.dim{opacity:.5}
#inp{font-size:20px;margin-top:6px}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acc button{background:var(--chip);border:0;border-radius:8px;min-width:38px;height:38px;color:var(--ink);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .big{margin-top:6px}
.foot-act{margin-top:6px}
details summary{cursor:pointer;margin-top:8px}

.tabs button{font-size:15px}
.clip{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.thumb{position:relative;border:0;padding:0;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;align-self:start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.thumb span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.thumb em{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-style:normal;font-size:12px;padding:1px 5px;border-radius:4px}
.vid{grid-column:1/-1;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cmeta b{display:block;font-weight:600;line-height:1.3}.cmeta small{display:block;color:var(--soft);font-size:13px;margin-top:2px}.seen{color:var(--sure);font-weight:700}
.hint{font-size:14px;color:var(--ink);background:var(--chip);border-radius:8px;padding:6px 9px;margin:6px 0 0}
.cact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cact .plain{font-size:14px;padding:7px 10px;text-decoration:none;display:inline-block}
.note-form{display:grid;gap:6px;margin-top:8px}.note-form .actions{margin-top:2px}
.ghost.inline{display:inline-block;width:auto;margin:0;padding:10px}
.fb.small{padding:8px 10px;font-size:14px;font-weight:600}
.res{display:block;text-decoration:none;color:var(--ink);padding:10px 0;border-top:1px solid var(--line)}.res b{display:block;color:var(--navy)}.res small{color:var(--soft);font-size:14px}
details{border-top:1px solid var(--line);padding:10px 0}details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}details summary::before{content:'›';display:inline-block;margin-right:8px;transition:transform .2s;color:var(--soft)}details[open] summary::before{transform:rotate(90deg)}details summary small{color:var(--soft)}
.del{background:none;border:0;color:var(--soft);font-size:16px;padding:6px}
ol.how{padding-left:20px}
@media (max-width:480px){.clip{grid-template-columns:1fr}.thumb{max-width:100%}}

.de{font-size:21px;font-family:"Iowan Old Style",Georgia,serif;margin:12px 0}.de.small{font-size:16px;color:var(--soft);font-family:inherit;margin:6px 0}
.en{font-size:22px;line-height:1.45;font-weight:600;margin:12px 0;color:var(--ink)}
mark{background:#ffe3a3;color:#3a2a00;border-radius:4px;padding:0 3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#6b5410;color:#fff4d1}}
.en.gap u{text-decoration:none;border-bottom:2px solid var(--accent);display:inline-block;min-width:60px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.three .big{margin-top:4px;font-size:17px;padding:14px 6px}.big.again{background:var(--no);color:var(--no-ink)}
.center{text-align:center}
.mic{background:var(--chip);border-radius:12px;padding:12px;margin-top:10px}.mic span{font-weight:700;color:var(--accent)}.mic p{min-height:24px;margin:6px 0}
.heardbox{background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:10px}.heardbox p{margin:4px 0}.score{font-size:14px}.hit{color:var(--sure);font-weight:600}.miss{color:var(--no-ink);font-weight:600}
.brand{display:flex;align-items:center;gap:12px;background:#111;border-radius:16px;padding:16px 18px;margin:4px 0 8px}.brand img{height:34px;width:auto;display:block}.brand span{color:#fff;font-family:"Iowan Old Style",Georgia,serif;font-size:22px;font-weight:700;border-left:2px solid #e4572e;padding-left:12px}.logotxt{color:#fff;font-size:24px}.sub{color:var(--soft);font-size:15px;margin:0 0 12px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.prompt{font-size:21px}}
</style>
</head>

async function openWith(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:_bd(ENC.iv)},k,_bd(ENC.data)));const s=document.createElement('script');s.textContent=t;document.body.appendChild(s)}
async function fromPw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:_bd(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,256))}
function lock(msg){document.getElementById('app').innerHTML=`<div class="lock"><div class="brand"><img src="https://www.babanews.ch/wp-content/uploads/2018/05/logo_babanews_trans-weiss-klein.png" alt="baba news" onerror="this.outerHTML='<b class=logotxt>baba news</b>'"><span>English</span></div><h2>Passwort</h2><p class="note">Diese Übungsapp ist nur für das baba news Team. Gib das Passwort einmal ein – danach merkt sich dieses Gerät den Zugang.</p><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" placeholder="Passwort"><button class="big" id="pwGo">Öffnen</button>${msg?`<p class="fb no">${msg}</p>`:''}</div>`;
 const go=async()=>{const b=document.getElementById('pwGo');b.disabled=true;b.textContent='Prüfe …';try{const raw=await fromPw(document.getElementById('pw').value);await openWith(raw);try{localStorage.setItem(KK,_be(raw))}catch(e){}}catch(e){lock('Das Passwort stimmt nicht.')}};
 document.getElementById('pwGo').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>document.getElementById('pw')?.focus(),50)}
(async()=>{let k=null;try{k=localStorage.getItem(KK)}catch(e){}if(k){try{await openWith(_bd(k));return}catch(e){try{localStorage.removeItem(KK)}catch(_){}}}lock('')})();
</script>
